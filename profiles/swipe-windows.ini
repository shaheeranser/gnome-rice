# Swipe between apps on ONE workspace. These are the extension's defaults, written out so the setup is reproducible.
[org/gnome/shell/extensions/touchpad-gesture-customization]
horizontal-swipe-3-fingers-gesture='WINDOW_SWITCHING'
vertical-swipe-3-fingers-gesture='OVERVIEW_NAVIGATION'
horizontal-swipe-4-fingers-gesture='WORKSPACE_SWITCHING'
alttab-all-workspaces=false
